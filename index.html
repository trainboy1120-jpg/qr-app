<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バッグ修理管理 | DEJ6</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh;font-size:14px;line-height:1.5}
.header{background:#fff;border-bottom:2px solid #e2e8f0;padding:0 1rem;position:sticky;top:0;z-index:100}
.header-inner{max-width:900px;margin:0 auto;height:54px;display:flex;align-items:center;justify-content:space-between}
.header-left h1{font-size:15px;font-weight:700}
.header-meta{display:flex;align-items:center;gap:12px;margin-top:2px}
.date-str{font-size:11px;color:#718096}
.live{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#38a169;font-weight:500}
.live-dot{width:6px;height:6px;border-radius:50%;background:#38a169;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.wrap{max-width:900px;margin:0 auto;padding:1.25rem 1rem}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;color:#1a202c;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .12s}
.btn:hover{background:#f7fafc}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:#0F6E56;color:#fff;border-color:transparent}
.btn-primary:hover{background:#0a5240}
.btn-danger{background:#dc2626;color:#fff;border-color:transparent}
.btn-danger:hover{background:#b91c1c}
.btn-swap{background:#7c3aed;color:#fff;border-color:transparent}
.btn-swap:hover{background:#6d28d9}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:1rem 1.25rem}
.stat-label{font-size:11px;color:#718096;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.stat-val{font-size:30px;font-weight:700;line-height:1}
.val-green{color:#0F6E56}
.val-red{color:#dc2626}
.val-purple{color:#7c3aed}
.tabs{display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:1.25rem}
.tab{padding:8px 18px;border:none;background:transparent;font-size:13px;color:#718096;cursor:pointer;font-family:inherit;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .12s}
.tab.on{color:#0F6E56;border-bottom-color:#0F6E56;font-weight:700}
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.filter-bar select{padding:5px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:inherit;color:#4a5568;background:#fff;outline:none}
.record-count{font-size:12px;color:#a0aec0;margin-left:auto}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:#f7fafc}
th{padding:9px 14px;text-align:left;font-size:11px;font-weight:600;color:#718096;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e2e8f0;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #f0f4f8;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.td-time{color:#a0aec0;font-size:12px;white-space:nowrap}
.td-bag{font-weight:600;font-size:12px;color:#4a5568}
.td-worker{color:#718096;font-size:12px}
.td-issue{font-size:12px}
.del-btn{border:none;background:transparent;color:#a0aec0;cursor:pointer;padding:5px 8px;border-radius:4px;line-height:1;display:inline-flex;align-items:center}
.del-btn:hover{background:#fee2e2;color:#dc2626}
.td-memo{color:#a0aec0;font-size:11px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-r{background:#dcfce7;color:#166534}
.badge-d{background:#fee2e2;color:#991b1b}
.badge-s{background:#ede9fe;color:#5b21b6}
.empty{text-align:center;padding:3rem 1rem;color:#a0aec0;font-size:13px}
.chart-section{padding:1.25rem}
.chart-title{font-size:12px;font-weight:700;color:#718096;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1rem}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chart-label{font-size:12px;color:#4a5568;width:210px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-bar-bg{flex:1;height:8px;background:#f0f4f8;border-radius:4px;overflow:hidden}
.chart-bar{height:100%;border-radius:4px;transition:width .4s}
.bar-r{background:#0F6E56}
.bar-d{background:#dc2626}
.bar-s{background:#7c3aed}
.chart-n{font-size:12px;font-weight:600;color:#4a5568;width:28px;text-align:right}
.chart-pct{font-size:11px;font-weight:600;color:#a0aec0;width:40px;text-align:right;flex-shrink:0}
.chart-tot{font-size:10px;font-weight:600;color:#a0aec0;letter-spacing:0;text-transform:none;margin-left:8px}
.chart-sep{height:1px;background:#f0f4f8;margin:1rem 0}
/* 統計: 期間切替（日別 / 週別 / 月別） */
.stats-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:.9rem 1.25rem;border-bottom:1px solid #f0f4f8}
.seg{display:inline-flex;background:#f0f4f8;border:1px solid #e2e8f0;border-radius:8px;padding:3px;gap:2px}
.seg button{padding:6px 18px;border:none;background:transparent;border-radius:6px;font-size:12px;font-weight:600;color:#718096;cursor:pointer;font-family:inherit;transition:all .12s}
.seg button.on{background:#fff;color:#0F6E56;box-shadow:0 1px 3px rgba(15,25,40,.14)}
.copy-btn{padding:5px 12px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;font-size:11px;font-weight:600;color:#4a5568;cursor:pointer;font-family:inherit}
.copy-btn:hover{background:#f7fafc}
.stats-note{font-size:11px;color:#a0aec0;margin-left:auto}
.trend{padding:1.1rem 1.25rem}
.legend{display:flex;align-items:center;gap:14px;margin-bottom:.9rem;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#718096;font-weight:600}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.trend-row{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;border-radius:6px;padding:6px;margin-bottom:2px;cursor:pointer;font-family:inherit;text-align:left}
.trend-row:hover{background:#f7fafc}
.trend-row.on{background:#f0fdf4;box-shadow:inset 0 0 0 1px #bbf7d0}
.trend-label{font-size:12px;color:#1a202c;font-weight:600;width:150px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trend-sub{color:#a0aec0;font-weight:500;font-size:11px;margin-left:5px}
.trend-bar-bg{flex:1;height:10px;background:#f0f4f8;border-radius:5px;overflow:hidden;display:flex}
.trend-seg{height:100%}
.trend-n{font-size:12px;font-weight:700;color:#1a202c;width:34px;text-align:right}
.trend-n.zero{color:#cbd5e0;font-weight:500}
.bd-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:.9rem}
.bd-title{font-size:13px;font-weight:700;color:#1a202c}
.bd-delta{font-size:11px;font-weight:700;padding:1px 9px;border-radius:20px;background:#f7fafc;color:#718096}
.bd-up{background:#fef2f2;color:#b91c1c}
.bd-down{background:#f0fdf4;color:#166534}
.link-btn{background:none;border:none;color:#0F6E56;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:underline;padding:0;margin-left:auto}
.bd-nums{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:1.1rem;padding-bottom:.9rem;border-bottom:1px solid #f0f4f8}
.bd-num-label{font-size:10px;color:#a0aec0;font-weight:700;letter-spacing:.04em;margin-bottom:3px}
.bd-num-val{font-size:22px;font-weight:700;line-height:1}
.bar-o{background:#a0aec0}
.more-bar{padding:.9rem;text-align:center;border-top:1px solid #f0f4f8}
/* QR一覧 */
.qr-section-title{font-size:11px;font-weight:700;color:#718096;text-transform:uppercase;letter-spacing:.05em;margin:1.25rem 0 .75rem;padding-left:2px}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:1.5rem}
.qr-item{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:1rem;display:flex;flex-direction:column;align-items:center;gap:7px}
.qr-item img{border-radius:6px;display:block}
.qr-item-label{font-size:11px;font-weight:600;text-align:center;color:#1a202c;line-height:1.4;width:100%}
.qr-item-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
/* BAT情報 */
.bat-info{width:100%;border-top:1px solid #f0f4f8;padding-top:7px;margin-top:2px}
.bat-row{display:flex;align-items:baseline;gap:4px;margin-bottom:3px}
.bat-key{font-size:9px;font-weight:700;color:#a0aec0;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.bat-val{font-size:10px;color:#4a5568;font-weight:600}
.bat-issue{font-size:10px;color:#718096}
.bat-btn{display:block;width:100%;margin-top:6px;padding:5px 0;background:#131921;color:#fff;border:none;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;letter-spacing:.02em;transition:background .12s}
.bat-btn:hover{background:#232f3e}
.bat-pending{font-size:10px;color:#a0aec0;text-align:center;margin-top:4px;font-style:italic}
.print-bar{display:flex;justify-content:flex-end;margin-bottom:1rem}
@media print{
  .header,.tabs,.print-bar,.stats{display:none!important}
  .wrap{padding:0}
  body{background:#fff}
  .qr-grid{grid-template-columns:repeat(4,1fr);gap:8px}
  .qr-item{border:1px solid #ccc;break-inside:avoid}
  .bat-btn{display:none}
}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,25,40,.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:1rem}
.modal{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,.18);max-height:90vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.modal-title{font-size:15px;font-weight:700}
.x-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#a0aec0;width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.x-btn:hover{background:#f0f4f8;color:#1a202c}
.fg{margin-bottom:.9rem}
.fg label{display:block;font-size:11px;font-weight:600;color:#718096;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;font-family:inherit;color:#1a202c;outline:none;background:#fff;transition:border .12s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#0F6E56;box-shadow:0 0 0 3px rgba(15,110,86,.08)}
.fg textarea{resize:vertical;min-height:56px}
.act-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:.9rem}
.act-btn{padding:10px 6px;border:2px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;text-align:center;transition:all .12s;color:#718096}
.act-btn.r.on{border-color:#0F6E56;background:#f0fdf4;color:#0F6E56}
.act-btn.d.on{border-color:#dc2626;background:#fef2f2;color:#dc2626}
.act-btn.s.on{border-color:#7c3aed;background:#f5f3ff;color:#7c3aed}
.swap-note{font-size:11px;color:#7c3aed;background:#f5f3ff;border-radius:6px;padding:6px 10px;margin-bottom:.9rem;line-height:1.5}
.swap-steps{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:10px 12px;margin-bottom:.9rem}
.swap-steps-title{font-size:10px;font-weight:700;color:#5b21b6;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.swap-step{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;font-size:11px;color:#4a5568;line-height:1.5}
.swap-step:last-child{margin-bottom:0}
.swap-step-num{background:#7c3aed;color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.swap-step-body{flex:1}
.swap-step-key{font-weight:700;color:#1a202c}
.swap-bat-link{display:inline-block;margin-top:8px;padding:5px 12px;background:#131921;color:#fff;border-radius:6px;font-size:10px;font-weight:700;text-decoration:none;letter-spacing:.02em}
.swap-bat-link:hover{background:#232f3e}
.help-wrap{padding:.25rem 0}
.help-section{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.help-h2{font-size:13px;font-weight:700;color:#1a202c;margin-bottom:1rem;display:flex;align-items:center;gap:6px}
.help-steps{display:flex;flex-direction:column;gap:.75rem}
.help-step{display:flex;align-items:flex-start;gap:12px}
.help-step-num{background:#0F6E56;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px}
.help-step-body{flex:1}
.help-step-title{font-size:13px;font-weight:700;color:#1a202c;margin-bottom:2px}
.help-step-desc{font-size:12px;color:#4a5568;line-height:1.6}
.help-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:.5rem}
.help-action{border-radius:8px;padding:12px 10px;text-align:center}
.help-action-r{background:#f0fdf4;border:1.5px solid #bbf7d0}
.help-action-d{background:#fef2f2;border:1.5px solid #fecaca}
.help-action-s{background:#f5f3ff;border:1.5px solid #ddd6fe}
.help-action-icon{font-size:20px;margin-bottom:4px}
.help-action-name{font-size:12px;font-weight:700;margin-bottom:4px}
.help-action-r .help-action-name{color:#0F6E56}
.help-action-d .help-action-name{color:#dc2626}
.help-action-s .help-action-name{color:#7c3aed}
.help-action-list{font-size:10px;color:#4a5568;text-align:left;line-height:1.7;padding-left:0;list-style:none}
.help-action-list li::before{content:"• ";color:#a0aec0}
.help-bat-steps{display:flex;flex-direction:column;gap:.6rem;margin-top:.5rem}
.help-bat-step{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#4a5568;line-height:1.5}
.help-bat-num{background:#131921;color:#fff;border-radius:4px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.help-tip{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;font-size:12px;color:#92400e;margin-top:.75rem;line-height:1.6}
.help-tip-title{font-weight:700;margin-bottom:2px}
.help-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:.5rem}
.help-table th{background:#f7fafc;padding:7px 12px;text-align:left;font-size:11px;font-weight:700;color:#718096;border-bottom:1px solid #e2e8f0}
.help-table td{padding:8px 12px;border-bottom:1px solid #f0f4f8;vertical-align:top;color:#4a5568;line-height:1.5}
.help-table tr:last-child td{border-bottom:none}
.help-shots{display:flex;flex-direction:column;gap:1rem;margin-top:.75rem}
.help-shot{border:1px solid #d4dce5;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(19,25,33,.06)}
.help-shot-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#131921;color:#fff;font-size:12px;font-weight:700}
.help-shot-no{background:#ff9900;color:#131921;border-radius:4px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:0 4px;flex-shrink:0}
.help-shot img{width:100%;display:block;background:#0a0e14}
.help-shot-cap{padding:8px 12px;font-size:12px;color:#4a5568;background:#f7fafc;border-top:1px solid #e4eaf0;line-height:1.5}
.help-reg-block{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:1rem}
.help-reg-head{padding:9px 14px;font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
.help-reg-head-r{background:#0F6E56}
.help-reg-head-s{background:#7c3aed}
.help-reg-tag{background:rgba(255,255,255,.22);border-radius:4px;font-size:10px;font-weight:700;padding:2px 7px;letter-spacing:.04em}
.help-reg-body{display:grid;grid-template-columns:1fr 210px;gap:1.25rem;padding:1rem 1.25rem;align-items:start}
.help-reg-shot{border:1px solid #d4dce5;border-radius:8px;overflow:hidden;box-shadow:0 1px 6px rgba(19,25,33,.06);background:#fff}
.help-reg-shot img{width:100%;display:block}
.help-reg-shot-cap{padding:6px 10px;font-size:11px;color:#718096;background:#f7fafc;border-top:1px solid #e4eaf0;text-align:center}
@media(max-width:600px){.help-reg-body{grid-template-columns:1fr}}
@media(max-width:600px){.help-actions{grid-template-columns:1fr}}
.bat-reg-bar{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
.bat-reg-bar input[type=date]{padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;font-family:inherit;color:#1a202c}
.bat-reg-note{font-size:11px;color:#718096;background:#f7fafc;border-radius:6px;padding:8px 12px;margin-bottom:1rem;line-height:1.6}
.bat-reg-group{background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:1rem;overflow:hidden}
.bat-reg-group-head{padding:10px 16px;font-size:12px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:space-between}
.bat-reg-head-repair{background:#0F6E56}
.bat-reg-head-damaged{background:#dc2626}
.bat-reg-head-swap{background:#7c3aed}
.bat-reg-head-pending{background:#a0aec0}
.bat-reg-issue{padding:10px 16px;border-bottom:1px solid #f0f4f8}
.bat-reg-issue:last-child{border-bottom:none}
.bat-reg-issue-title{font-size:12px;font-weight:700;color:#1a202c;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bat-reg-issue-en{font-size:11px;color:#718096;font-weight:600;white-space:nowrap}
.bat-reg-bags{font-size:11px;color:#4a5568;line-height:1.8;word-break:break-all}
.bat-reg-count{background:rgba(255,255,255,.25);padding:1px 9px;border-radius:10px;font-size:11px}
.bat-reg-empty{text-align:center;padding:3rem 1rem;color:#a0aec0;font-size:13px}
.bat-reg-total{font-size:12px;color:#718096;font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a202c;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:9999;pointer-events:none;animation:fadeup .2s}
@keyframes fadeup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.hide-sp{display:none}.chart-label{width:130px}.trend-label{width:96px}.bd-nums{gap:16px}.qr-grid{grid-template-columns:repeat(2,1fr)}}
</style>

/* 全角→半角 正規化（スキャナ入力のIME全角化対策: 全角数字/英字/記号→半角, 各種ダッシュ→ハイフン） */
const normalizeCode = s => (s||'')
  .replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
  .replace(/\u3000/g, ' ')
  .replace(/[\u30FC\u2010-\u2015\u2212]/g, '-')
  .trim();

/* ===== 統計: 期間集計（日別 / 週別 / 月別） ===== */
const P2=n=>String(n).padStart(2,'0');
const WDAY=['日','月','火','水','木','金','土'];
const PERIODS=[{id:'day',label:'日別'},{id:'week',label:'週別'},{id:'month',label:'月別'}];
const PREV_LABEL={day:'前日比',week:'前週比',month:'前月比'};
/* 推移に表示する期間数（新しい順） */
const MAX_BUCKETS={day:14,week:8,month:6};
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
/* 週は日曜始まり（Amazonウィーク） */
const weekStart=d=>{const s=dayStart(d);s.setDate(s.getDate()-s.getDay());return s;};
/* Amazonウィーク番号: 1/1を含む週をW1（2026: W32=8/2〜8/8, W38=9/13〜9/19 で検証済み） */
const amznWeek=d=>{
  const s=weekStart(d),y=s.getFullYear();
  if(s.getTime()>=weekStart(new Date(y+1,0,1)).getTime())return{y:y+1,w:1};
  return{y,w:Math.round((s.getTime()-weekStart(new Date(y,0,1)).getTime())/6048e5)+1};
};
/* 同じ期間なら同じ文字列になるキー */
const bucketKey=(d,mode)=>{
  if(mode==='month')return 'M'+d.getFullYear()+'-'+P2(d.getMonth()+1);
  if(mode==='week'){const w=amznWeek(d);return 'W'+w.y+'-'+P2(w.w);}
  return 'D'+d.getFullYear()+'-'+P2(d.getMonth()+1)+'-'+P2(d.getDate());
};
/* from〜to を新しい順に並べた期間リスト（記録0の期間も欠けさせない） */
const bucketList=(mode,from,to)=>{
  const out=[];
  if(mode==='month'){
    let c=new Date(to.getFullYear(),to.getMonth(),1);
    const f=new Date(from.getFullYear(),from.getMonth(),1);
    while(c>=f){out.push({key:bucketKey(c,mode),label:c.getFullYear()+'年'+(c.getMonth()+1)+'月',sub:''});c=new Date(c.getFullYear(),c.getMonth()-1,1);}
  }else if(mode==='week'){
    let c=weekStart(to);const f=weekStart(from);
    while(c>=f){
      const e=new Date(c.getFullYear(),c.getMonth(),c.getDate()+6);
      out.push({key:bucketKey(c,mode),label:'W'+amznWeek(c).w,sub:(c.getMonth()+1)+'/'+c.getDate()+'〜'+(e.getMonth()+1)+'/'+e.getDate()});
      c=new Date(c.getFullYear(),c.getMonth(),c.getDate()-7);
    }
  }else{
    let c=dayStart(to);const f=dayStart(from);
    while(c>=f){out.push({key:bucketKey(c,mode),label:(c.getMonth()+1)+'/'+c.getDate(),sub:'('+WDAY[c.getDay()]+')'});c=new Date(c.getFullYear(),c.getMonth(),c.getDate()-1);}
  }
  return out;
};
const EMPTY_CNT={r:0,d:0,s:0,t:0};
/* 期間キー別のアクション件数 */
const countByBucket=(logs,mode)=>{
  const m={};
  logs.forEach(l=>{
    if(!l.scanned_at)return;
    const k=bucketKey(new Date(l.scanned_at),mode);
    const o=m[k]||(m[k]={r:0,d:0,s:0,t:0});
    const a=parse(l).action;
    if(a==='修理')o.r++;else if(a==='廃棄')o.d++;else if(a==='QR貼り換え')o.s++;
    o.t++;
  });
  return m;
};

/* 記録追加モーダル — 修理/廃棄/QR貼り換えの3アクション */
function AddModal({onClose,onAdd,initAction,initIssue}){
  const[action,setAction]=useState(initAction||'修理');
  const[issue,setIssue]=useState(initIssue||(initAction==='廃棄'?DISPOSAL_ISSUES[0]:REPAIR_ISSUES[0]));
  const[bagId,setBagId]=useState('');
  const[oldBarcode,setOldBarcode]=useState('');
  const[newBarcode,setNewBarcode]=useState('');
  const[worker,setWorker]=useState('');
  const[memo,setMemo]=useState('');
  const nowLocal=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);};
  const[scannedAt,setScannedAt]=useState(nowLocal());
  const[saving,setSaving]=useState(false);

  const isSwap=action==='QR貼り換え';
  const issues=action==='修理'?REPAIR_ISSUES:DISPOSAL_ISSUES;

  useEffect(()=>{
    if(action==='修理')setIssue(initIssue||REPAIR_ISSUES[0]);
    else if(action==='廃棄')setIssue(initIssue||DISPOSAL_ISSUES[0]);
  },[action]);

  const canSubmit=isSwap
    ?(oldBarcode.trim()&&newBarcode.trim())
    :(bagId.trim());

  const submit=async()=>{
    if(!canSubmit)return;
    setSaving(true);
    await onAdd({
      action,
      issue: isSwap?'QR貼り換え':issue,
      bag_id: isSwap?null:normalizeCode(bagId),
      old_barcode: isSwap?normalizeCode(oldBarcode):null,
      new_barcode: isSwap?normalizeCode(newBarcode):null,
      worker:worker.trim(),
      memo:memo.trim(),
      scanned_at: scannedAt? new Date(scannedAt).toISOString() : new Date().toISOString()
    });
    setSaving(false);
  };

  const h=(t,p,...c)=>React.createElement(t,p,...c);
  const btnColor=action==='修理'?'btn-primary':action==='廃棄'?'btn-danger':'btn-swap';

  return h('div',{className:'overlay',onClick:e=>e.target===e.currentTarget&&onClose()},
    h('div',{className:'modal'},
      h('div',{className:'modal-header'},
        h('div',{className:'modal-title'},'修理記録を追加'),
        h('button',{className:'x-btn',onClick:onClose},'×')
      ),
      h('div',{style:{marginBottom:'.9rem'}},
        h('div',{style:{fontSize:11,fontWeight:600,color:'#718096',textTransform:'uppercase',letterSpacing:'.04em',marginBottom:6}},'アクション'),
        h('div',{className:'act-row'},
          h('button',{className:'act-btn r'+(action==='修理'?' on':''),onClick:()=>setAction('修理')},'🔧 修理'),
          h('button',{className:'act-btn d'+(action==='廃棄'?' on':''),onClick:()=>setAction('廃棄')},'🗑 廃棄'),
          h('button',{className:'act-btn s'+(isSwap?' on':''),onClick:()=>setAction('QR貼り換え')},'↔ QR貼り換え')
        )
      ),
      isSwap
        ? h('div',null,
            h('div',{className:'fg'},h('label',null,'古いバーコード（旧QR）＊'),h('input',{type:'text',placeholder:'旧QRをスキャン',value:oldBarcode,onChange:e=>setOldBarcode(normalizeCode(e.target.value)),autoFocus:true,autoComplete:'off'})),
            h('div',{className:'fg'},h('label',null,'新しいバーコード（新QR）＊'),h('input',{type:'text',placeholder:'新QRをスキャン',value:newBarcode,onChange:e=>setNewBarcode(normalizeCode(e.target.value)),autoComplete:'off'}))
          )
        : h('div',{className:'fg'},h('label',null,'問題種別'),h('select',{value:issue,onChange:e=>setIssue(e.target.value)},issues.map(i=>h('option',{key:i,value:i},i)))),
      !isSwap&&h('div',{className:'fg'},h('label',null,'バッグID＊'),h('input',{type:'text',placeholder:'スキャンまたは入力',value:bagId,onChange:e=>setBagId(normalizeCode(e.target.value)),autoFocus:!isSwap,autoComplete:'off'})),
      h('div',{className:'fg'},h('label',null,'作業者名（任意）'),h('input',{type:'text',placeholder:'例：田中',value:worker,onChange:e=>setWorker(e.target.value)})),
      h('div',{className:'fg'},h('label',null,'作業日時'),h('input',{type:'datetime-local',value:scannedAt,onChange:e=>setScannedAt(e.target.value)})),
      h('div',{className:'fg'},h('label',null,'メモ（任意）'),h('textarea',{placeholder:'特記事項など',value:memo,onChange:e=>setMemo(e.target.value)})),
      h('div',{style:{display:'flex',gap:8,marginTop:4}},
        h('button',{className:'btn',style:{flex:1},onClick:onClose},'キャンセル'),
        h('button',{className:'btn '+btnColor,style:{flex:2},onClick:submit,disabled:!canSubmit||saving},saving?'記録中...':'記録する')
      )
    )
  );
}

/* BAT登録タブ — 当日分をScenario/Issue別に集計＋CSV出力 */
function BatRegisterTab({logs}){
  const h=(t,p,...c)=>React.createElement(t,p,...c);
  const localDateStr=iso=>{const d=new Date(iso);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
  const todayStr=localDateStr(new Date().toISOString());
  const[date,setDate]=useState(todayStr);

  const dayLogs=logs.filter(l=>localDateStr(l.scanned_at)===date);

  const groups={Repair:{},Damaged:{}};
  const swapList=[];
  const pendingList=[];
  dayLogs.forEach(l=>{
    const d=parse(l);
    if(d.action==='QR貼り換え'){swapList.push({old:d.old_barcode,nw:d.new_barcode});return;}
    const bat=BAT_MAP[d.issue];
    if(bat===null||bat===undefined){pendingList.push({issue:d.issue,bag:d.bag_id});return;}
    const sc=bat.scenario,is=bat.issue;
    if(!groups[sc])groups[sc]={};
    if(!groups[sc][is])groups[sc][is]=[];
    groups[sc][is].push(d.bag_id);
  });

  const exportCSV=()=>{
    const rows=[['日時','アクション','問題種別','Scenario','Issue','バッグID','旧バーコード','新バーコード','作業者','メモ']];
    dayLogs.forEach(l=>{
      const d=parse(l);
      const bat=BAT_MAP[d.issue]||{scenario:'',issue:''};
      const isSwap=d.action==='QR貼り換え';
      rows.push([
        fmtDT(l.scanned_at),d.action||'',isSwap?'QR貼り換え':(d.issue||''),
        isSwap?'Barcode Mapping':(bat.scenario||''),isSwap?'':(bat.issue||''),
        d.bag_id||'',d.old_barcode||'',d.new_barcode||'',l.worker_name||'',(d.memo||'').replace(/[\r\n]+/g,' ')
      ]);
    });
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='BAT登録_'+date+'.csv';a.click();
    URL.revokeObjectURL(url);
  };

  const scLabel={Repair:'🔧 Repair（修理）',Damaged:'🗑 Damaged（廃棄）'};
  const scCls={Repair:'bat-reg-head-repair',Damaged:'bat-reg-head-damaged'};
  const renderGroup=sc=>{
    const issues=groups[sc];const keys=Object.keys(issues);
    if(keys.length===0)return null;
    const total=keys.reduce((s,k)=>s+issues[k].length,0);
    return h('div',{key:sc,className:'bat-reg-group'},
      h('div',{className:'bat-reg-group-head '+scCls[sc]},h('span',null,scLabel[sc]),h('span',{className:'bat-reg-count'},total+'件')),
      keys.map(is=>h('div',{key:is,className:'bat-reg-issue'},
        h('div',{className:'bat-reg-issue-title'},h('span',null,issues[is].length+'件'),h('span',{className:'bat-reg-issue-en'},'BAT: '+sc+' / '+is)),
        h('div',{className:'bat-reg-bags'},issues[is].map(b=>b||'(ID未入力)').join('、'))
      ))
    );
  };

  const totalAll=dayLogs.length;
  return h('div',null,
    h('div',{className:'bat-reg-bar'},
      h('label',{style:{fontSize:12,fontWeight:600,color:'#718096'}},'対象日'),
      h('input',{type:'date',value:date,onChange:e=>setDate(e.target.value)}),
      h('span',{className:'bat-reg-total'},totalAll+'件'),
      h('button',{className:'btn btn-primary',style:{marginLeft:'auto'},onClick:exportCSV,disabled:totalAll===0},'⬇ CSV出力')
    ),
    h('div',{className:'bat-reg-note'},'この一覧を見ながら BAT Tools へ手動で登録してください。Scenario / Issue はBATの選択項目に対応しています。'),
    totalAll===0
      ?h('div',{className:'card'},h('div',{className:'bat-reg-empty'},'この日の記録はありません'))
      :h('div',null,
        renderGroup('Repair'),
        renderGroup('Damaged'),
        swapList.length>0&&h('div',{className:'bat-reg-group'},
          h('div',{className:'bat-reg-group-head bat-reg-head-swap'},h('span',null,'↔ Barcode Mapping（QR貼り換え）'),h('span',{className:'bat-reg-count'},swapList.length+'件')),
          swapList.map((s,i)=>h('div',{key:i,className:'bat-reg-issue'},h('div',{className:'bat-reg-bags'},(s.old||'(旧)')+' → '+(s.nw||'(新)'))))
        ),
        pendingList.length>0&&h('div',{className:'bat-reg-group'},
          h('div',{className:'bat-reg-group-head bat-reg-head-pending'},h('span',null,'⚠ BAT登録先 確認中'),h('span',{className:'bat-reg-count'},pendingList.length+'件')),
          pendingList.map((p,i)=>h('div',{key:i,className:'bat-reg-issue'},
            h('div',{className:'bat-reg-issue-title'},h('span',null,p.issue)),
            h('div',{className:'bat-reg-bags'},p.bag||'(ID未入力)')
          ))
        )
      )
  );
}

/* 統計タブ — 日別/週別/月別の推移 ＋ 選択した期間の内訳 */
function StatsTab({logs}){
  const h=(t,p,...c)=>React.createElement(t,p,...c);
  const[mode,setMode]=useState('day');
  const[sel,setSel]=useState(null);   /* null=最新期間 / 'ALL'=全期間 / それ以外=期間キー */
  const[extra,setExtra]=useState(0);  /* 既定より前の期間を追加表示する数 */
  const[copied,setCopied]=useState(false);

  const dated=logs.filter(l=>l.scanned_at);
  if(dated.length===0)return h('div',{className:'card'},h('div',{className:'empty'},'データがありません'));

  const times=dated.map(l=>new Date(l.scanned_at).getTime());
  const oldest=new Date(Math.min(...times));
  const newest=new Date(Math.max(...times));
  const now=new Date();
  const to=newest>now?newest:now;   /* 先の日付の記録があっても表から漏れないように */
  const all=bucketList(mode,oldest,to);
  const shown=all.slice(0,MAX_BUCKETS[mode]+extra);
  const cnt=countByBucket(dated,mode);
  const cntOf=k=>cnt[k]||EMPTY_CNT;
  const curKey=sel===null?(shown[0]?shown[0].key:null):sel;
  const maxT=Math.max(...shown.map(b=>cntOf(b.key).t),1);

  /* 内訳の対象ログと前期間比 */
  const target=curKey==='ALL'?dated:dated.filter(l=>bucketKey(new Date(l.scanned_at),mode)===curKey);
  const curB=all.find(b=>b.key===curKey);
  const idx=all.findIndex(b=>b.key===curKey);
  const prevB=idx>=0?all[idx+1]:null;
  const delta=(curKey==='ALL'||!prevB)?null:target.length-cntOf(prevB.key).t;
  const cur=curKey==='ALL'
    ?dated.reduce((o,l)=>{const a=parse(l).action;if(a==='修理')o.r++;else if(a==='廃棄')o.d++;else if(a==='QR貼り換え')o.s++;o.t++;return o;},{r:0,d:0,s:0,t:0})
    :cntOf(curKey);

  /* 内訳はアクション別に集計する（issueリストに無い旧ラベルも該当グループに入り、上の数字と必ず一致する） */
  const byAction={'修理':{},'廃棄':{},'QR貼り換え':{},'その他':{}};
  target.forEach(l=>{
    const d=parse(l);
    const a=byAction[d.action]?d.action:'その他';
    const iss=(d.issue&&d.issue!=='—')?d.issue:'(項目未入力)';
    byAction[a][iss]=(byAction[a][iss]||0)+1;
  });
  const byN=(a,b)=>b[1]-a[1];
  const sorted=a=>Object.entries(byAction[a]).sort(byN);
  const repairStats=sorted('修理'),disposalStats=sorted('廃棄'),swapStats=sorted('QR貼り換え'),otherStats=sorted('その他');
  const maxN=Math.max(...[].concat(repairStats,disposalStats,swapStats,otherStats).map(x=>x[1]),1);

  const copyTable=async()=>{
    const rows=[['期間','修理','廃棄','QR貼り換え','合計']];
    shown.slice().reverse().forEach(b=>{const c=cntOf(b.key);rows.push([(b.label+' '+b.sub).trim(),c.r,c.d,c.s,c.t]);});
    const tsv=rows.map(r=>r.join('\t')).join('\n');
    try{
      await navigator.clipboard.writeText(tsv);
    }catch{
      const ta=document.createElement('textarea');ta.value=tsv;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');}catch{}
      ta.remove();
    }
    setCopied(true);setTimeout(()=>setCopied(false),1600);
  };

  const seg=(w,cls)=>w>0&&h('div',{className:'trend-seg '+cls,style:{width:w+'%'}});
  const group=(title,arr,cls)=>{
    if(arr.length===0)return null;
    const tot=arr.reduce((s,x)=>s+x[1],0);   /* 割合の母数はそのグループ（修理内・廃棄内）の合計 */
    return h('div',null,
      h('div',{className:'chart-title'},title,h('span',{className:'chart-tot'},'計 '+tot+'件')),
      arr.map(([issue,n])=>h('div',{key:issue,className:'chart-row'},
        h('div',{className:'chart-label',title:issue},issue),
        h('div',{className:'chart-bar-bg'},h('div',{className:'chart-bar '+cls,style:{width:(n/maxN*100)+'%'}})),
        h('div',{className:'chart-n'},n),
        h('div',{className:'chart-pct',title:n+'/'+tot},Math.round(n/tot*100)+'%')))
    );
  };
  const groups=[
    group('🔧 修理',repairStats,'bar-r'),
    group('🗑 廃棄',disposalStats,'bar-d'),
    group('↔ QR貼り換え',swapStats,'bar-s'),
    group('その他（アクション不明）',otherStats,'bar-o')
  ].filter(Boolean);

  return h('div',null,
    h('div',{className:'card'},
      h('div',{className:'stats-bar'},
        h('div',{className:'seg'},PERIODS.map(p=>h('button',{key:p.id,className:mode===p.id?'on':'',onClick:()=>{setMode(p.id);setSel(null);setExtra(0);}},p.label))),
        h('button',{className:'copy-btn',onClick:copyTable},copied?'✓ コピーしました':'📋 表をコピー'),
        h('span',{className:'stats-note'},'全'+dated.length+'件（'+(oldest.getMonth()+1)+'/'+oldest.getDate()+'〜'+(newest.getMonth()+1)+'/'+newest.getDate()+'）')
      ),
      h('div',{className:'trend'},
        h('div',{className:'legend'},
          h('span',null,h('i',{style:{background:'#0F6E56'}}),'修理'),
          h('span',null,h('i',{style:{background:'#dc2626'}}),'廃棄'),
          h('span',null,h('i',{style:{background:'#7c3aed'}}),'QR貼り換え'),
          h('span',{style:{marginLeft:'auto',color:'#cbd5e0'}},'行をタップすると下に内訳')
        ),
        shown.map(b=>{
          const c=cntOf(b.key);
          return h('button',{key:b.key,className:'trend-row'+(b.key===curKey?' on':''),onClick:()=>setSel(b.key)},
            h('div',{className:'trend-label'},b.label,b.sub&&h('span',{className:'trend-sub'},b.sub)),
            h('div',{className:'trend-bar-bg'},seg(c.r/maxT*100,'bar-r'),seg(c.d/maxT*100,'bar-d'),seg(c.s/maxT*100,'bar-s')),
            h('div',{className:'trend-n'+(c.t===0?' zero':'')},c.t)
          );
        }),
        all.length>shown.length&&h('div',{className:'more-bar'},
          h('button',{className:'btn',onClick:()=>setExtra(x=>x+MAX_BUCKETS[mode])},'さらに前を表示（残り'+(all.length-shown.length)+'期間）'))
      )
    ),
    h('div',{className:'card',style:{marginTop:'1rem'}},
      h('div',{className:'chart-section'},
        h('div',{className:'bd-head'},
          h('span',{className:'bd-title'},curKey==='ALL'?'全期間の内訳':((curB?(curB.label+' '+curB.sub).trim():'—')+' の内訳')),
          delta!==null&&h('span',{className:'bd-delta'+(delta>0?' bd-up':delta<0?' bd-down':'')},PREV_LABEL[mode]+' '+(delta>0?'+':'')+delta+'件'),
          curKey==='ALL'
            ?h('button',{className:'link-btn',onClick:()=>setSel(null)},'最新の期間に戻す')
            :h('button',{className:'link-btn',onClick:()=>setSel('ALL')},'全期間の内訳を見る')
        ),
        h('div',{className:'bd-nums'},
          h('div',null,h('div',{className:'bd-num-label'},'修理'),h('div',{className:'bd-num-val val-green'},cur.r)),
          h('div',null,h('div',{className:'bd-num-label'},'廃棄'),h('div',{className:'bd-num-val val-red'},cur.d)),
          h('div',null,h('div',{className:'bd-num-label'},'QR貼り換え'),h('div',{className:'bd-num-val val-purple'},cur.s)),
          h('div',null,h('div',{className:'bd-num-label'},'合計'),h('div',{className:'bd-num-val'},cur.t))
        ),
        groups.length===0
          ?h('div',{className:'empty'},'この期間の記録はありません')
          :h('div',null,groups.map((g,i)=>h('div',{key:i},g,i<groups.length-1&&h('div',{className:'chart-sep'}))))
      )
    )
  );
}

function App(){
  const[logs,setLogs]=useState([]);
  const[tab,setTab]=useState('list');
  const[filter,setFilter]=useState('all');
  const[listMax,setListMax]=useState(200);
  const[showAdd,setShowAdd]=useState(false);
  const[initParams,setInitParams]=useState({action:null,issue:null});
  const[toast,setToast]=useState(null);
  const[loading,setLoading]=useState(true);
  const notify=msg=>setToast(msg);
  const h=(t,p,...c)=>React.createElement(t,p,...c);

  const fetchLogs=useCallback(async()=>{
    const{data}=await supabase.from('scan_logs').select('*').order('scanned_at',{ascending:false}).limit(3000);
    if(data)setLogs(data);
  },[]);

  useEffect(()=>{
    const{action,issue}=getParams();
    if(action){setInitParams({action,issue});setShowAdd(true);}
    (async()=>{await getSysId();await fetchLogs();setLoading(false);})();
    const ch=supabase.channel('bag_repair_ch').on('postgres_changes',{event:'*',schema:'public',table:'scan_logs'},fetchLogs).subscribe();
    return()=>supabase.removeChannel(ch);
  },[fetchLogs]);

  const handleAdd=async({action,issue,bag_id,old_barcode,new_barcode,worker,memo,scanned_at})=>{
    const id=await getSysId();
    const comment=JSON.stringify(
      action==='QR貼り換え'
        ?{action,issue,old_barcode,new_barcode,memo}
        :{action,issue,bag_id,memo}
    );
    const row={qr_code_id:id,worker_name:worker,comment};
    if(scanned_at)row.scanned_at=scanned_at;
    const{error}=await supabase.from('scan_logs').insert(row);
    if(error){notify('エラー: '+error.message);return;}
    setShowAdd(false);
    window.history.replaceState({},'',APP_URL);
    notify('✓ 記録しました');
  };

  const handleDelete=async log=>{
    const d=parse(log);
    const label=(d.action||'')+' ／ '+(d.action==='QR貼り換え'
      ?((d.old_barcode||'—')+' → '+(d.new_barcode||'—'))
      :(d.bag_id||'ID未入力'))+' ／ '+fmtDT(log.scanned_at);
    if(!window.confirm('この記録を削除しますか？\n\n'+label+'\n\n※この操作は取り消せません'))return;
    const{error}=await supabase.from('scan_logs').delete().eq('id',log.id);
    if(error){notify('エラー: '+error.message);return;}
    await fetchLogs();
    notify('✓ 削除しました');
  };

  const todayDate=new Date().toDateString();
  const todayLogs=logs.filter(l=>new Date(l.scanned_at).toDateString()===todayDate);
  const todayR=todayLogs.filter(l=>{try{return JSON.parse(l.comment).action==='修理';}catch{return false;}}).length;
  const todayD=todayLogs.filter(l=>{try{return JSON.parse(l.comment).action==='廃棄';}catch{return false;}}).length;
  const todayS=todayLogs.filter(l=>{try{return JSON.parse(l.comment).action==='QR貼り換え';}catch{return false;}}).length;

  const filtered=logs.filter(l=>{
    try{
      const d=JSON.parse(l.comment||'{}');
      if(filter==='repair')return d.action==='修理';
      if(filter==='disposal')return d.action==='廃棄';
      if(filter==='swap')return d.action==='QR貼り換え';
      return true;
    }catch{return filter==='all';}
  });

  const visible=filtered.slice(0,listMax);

  if(loading)return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',color:'#718096'}},'読み込み中...');

  return h(React.Fragment,null,
    h('div',{className:'header'},h('div',{className:'header-inner'},
      h('div',{className:'header-left'},
        h('h1',null,'バッグ修理管理'),
        h('div',{className:'header-meta'},
          h('span',{className:'date-str'},fmtToday()),
          h('span',{className:'live'},h('span',{className:'live-dot'}),'リアルタイム同期中')
        )
      ),
      h('button',{className:'btn btn-primary',onClick:()=>{setInitParams({action:null,issue:null});setShowAdd(true);}},'＋ 記録追加')
    )),
    h('div',{className:'wrap'},
      h('div',{className:'stats'},
        h('div',{className:'stat'},h('div',{className:'stat-label'},'今日の修理'),h('div',{className:'stat-val val-green'},todayR)),
        h('div',{className:'stat'},h('div',{className:'stat-label'},'今日の廃棄'),h('div',{className:'stat-val val-red'},todayD)),
        h('div',{className:'stat'},h('div',{className:'stat-label'},'QR貼り換え'),h('div',{className:'stat-val val-purple'},todayS)),
        h('div',{className:'stat'},h('div',{className:'stat-label'},'今日の合計'),h('div',{className:'stat-val'},todayLogs.length))
      ),
      h('div',{className:'tabs'},
        h('button',{className:'tab'+(tab==='list'?' on':''),onClick:()=>setTab('list')},'記録一覧'),
        h('button',{className:'tab'+(tab==='stats'?' on':''),onClick:()=>setTab('stats')},'統計'),
        h('button',{className:'tab'+(tab==='qr'?' on':''),onClick:()=>setTab('qr')},'QR一覧'),
        h('button',{className:'tab'+(tab==='bat'?' on':''),onClick:()=>setTab('bat')},'BAT登録'),
        h('button',{className:'tab'+(tab==='help'?' on':''),onClick:()=>setTab('help')},'使い方')
      ),
      tab==='list'&&h('div',null,
        h('div',{className:'filter-bar'},
          h('select',{value:filter,onChange:e=>setFilter(e.target.value)},
            h('option',{value:'all'},'すべて'),
            h('option',{value:'repair'},'修理のみ'),
            h('option',{value:'disposal'},'廃棄のみ'),
            h('option',{value:'swap'},'QR貼り換えのみ')),
          h('span',{className:'record-count'},filtered.length+' 件')
        ),
        h('div',{className:'card'},
          filtered.length===0
            ?h('div',{className:'empty'},'記録がありません')
            :h(React.Fragment,null,
              h('table',null,
              h('thead',null,h('tr',null,
                h('th',null,'日時'),h('th',null,'アクション'),h('th',null,'詳細'),
                h('th',{className:'hide-sp'},'バーコード'),h('th',{className:'hide-sp'},'作業者'),h('th',{className:'hide-sp'},'メモ'),h('th',{style:{width:44}},''))),
              h('tbody',null,visible.map(log=>{
                const d=parse(log);
                const isSwap=d.action==='QR貼り換え';
                const badgeCls='badge '+(d.action==='修理'?'badge-r':d.action==='廃棄'?'badge-d':'badge-s');
                const barcodeCell=isSwap
                  ?h('span',{className:'td-bag',style:{fontSize:11}},(d.old_barcode||'—')+' → '+(d.new_barcode||'—'))
                  :h('span',{className:'td-bag'},d.bag_id||'—');
                return h('tr',{key:log.id},
                  h('td',null,h('span',{className:'td-time'},fmtDT(log.scanned_at))),
                  h('td',null,h('span',{className:badgeCls},d.action)),
                  h('td',null,h('span',{className:'td-issue'},isSwap?'Barcode Mapping':d.issue)),
                  h('td',{className:'hide-sp'},barcodeCell),
                  h('td',{className:'hide-sp'},h('span',{className:'td-worker'},log.worker_name||'—')),
                  h('td',{className:'hide-sp'},h('span',{className:'td-memo',title:d.memo},d.memo||'')),h('td',null,h('button',{className:'del-btn',title:'この記録を削除',onClick:()=>handleDelete(log)},h('svg',{width:15,height:15,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M3 6h18'}),h('path',{d:'M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2'}),h('path',{d:'M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6'}),h('line',{x1:10,y1:11,x2:10,y2:17}),h('line',{x1:14,y1:11,x2:14,y2:17})))));
              }))),
              filtered.length>visible.length&&h('div',{className:'more-bar'},
                h('button',{className:'btn',onClick:()=>setListMax(m=>m+200)},'さらに表示（残り'+(filtered.length-visible.length)+'件）'))
            )
        )
      ),
      tab==='stats'&&React.createElement(StatsTab,{logs}),
      tab==='qr'&&React.createElement(QRListTab),
      tab==='bat'&&React.createElement(BatRegisterTab,{logs}),
      tab==='help'&&React.createElement(HelpTab)
    ),
    showAdd&&h(AddModal,{onClose:()=>{setShowAdd(false);window.history.replaceState({},'',APP_URL);},onAdd:handleAdd,initAction:initParams.action,initIssue:initParams.issue}),
    toast&&h(Toast,{key:toast+Date.now(),msg:toast,onDone:()=>setToast(null)})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
